services:
  # 1. Frontend Static Site (Render Global Edge CDN — 0ms Cold Start, Instant Page Load)
  - type: static
    name: seth-and-sons-dryfruits-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sethandsonsdryfruits.onrender.com

  # 2. Backend API Web Service (Node.js + Express + MongoDB)
  - type: web
    name: seth-and-sons-dryfruits
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: APP_URL
        value: https://sethandsonsdryfruits.onrender.com
      - key: ADMIN_URL
        value: https://sethandsonsdryfruits.onrender.com
      - key: EMAIL_FROM
        value: abheetseth203@gmail.com
      - key: EMAIL_FROM_NAME
        value: Seth And Sons DryFruits
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
