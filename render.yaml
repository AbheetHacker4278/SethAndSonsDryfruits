services:
  - type: web
    name: seth-and-sons-dryfruits
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: EMAIL_FROM
        value: abheetseth203@gmail.com
      - key: EMAIL_FROM_NAME
        value: Seth And Sons DryFruits
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
